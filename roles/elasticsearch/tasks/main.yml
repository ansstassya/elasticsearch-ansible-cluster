---
- name: Update apt cache
  apt:
    update_cache: true

- name: Install prerequisites
  apt:
    name:
      - apt-transport-https
      - gnupg
    state: present

- name: Ensure keyrings directory exists
  file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"

- name: Download and dearmor Elasticsearch GPG key
  shell: curl -fsSL https://artifacts.elastic.co/GPG-KEY-elasticsearch | gpg --dearmor -o /usr/share/keyrings/elastic.gpg
  args:
    creates: /usr/share/keyrings/elastic.gpg

- name: Add Elasticsearch APT repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/elastic.gpg] https://artifacts.elastic.co/packages/8.x/apt stable main"
    state: present
    filename: elastic-8.x

- name: Install Elasticsearch
  apt:
    name: elasticsearch
    state: present
    update_cache: true

- name: Copy TLS certificate bundle
  copy:
    src: elastic-certs.p12
    dest: /etc/elasticsearch/elastic-certs.p12
    owner: root
    group: elasticsearch
    mode: "0660"
  notify: restart elasticsearch

- name: Configure elasticsearch.yml
  template:
    src: elasticsearch.yml.j2
    dest: /etc/elasticsearch/elasticsearch.yml
  notify: restart elasticsearch

- name: Start and enable Elasticsearch
  systemd:
    name: elasticsearch
    state: started
    enabled: true

- name: Wait for cluster to be ready
  uri:
    url: "http://{{ hostvars['es-node-1']['ansible_host'] }}:9200/_cluster/health"
    url_username: elastic
    url_password: "{{ vault_elastic_password }}"
    status_code: 200
  register: health_check
  until: health_check.status == 200
  retries: 10
  delay: 5
  run_once: true
  delegate_to: localhost
  become: false

- name: Create logs-index with explicit settings and mapping
  uri:
    url: "http://{{ hostvars['es-node-1']['ansible_host'] }}:9200/logs-index"
    method: PUT
    url_username: elastic
    url_password: "{{ vault_elastic_password }}"
    body: "{{ lookup('template', 'index-settings.json.j2') }}"
    body_format: json
    status_code: [200, 201, 400]
  run_once: true
  delegate_to: localhost
  become: false
